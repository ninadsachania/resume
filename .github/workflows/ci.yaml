name: Build resume

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PDF
        shell: pwsh
        run: .\bin\typst.exe compile main.typ main.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: main.pdf
          if-no-files-found: error
